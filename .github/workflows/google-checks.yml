name: Service Desk update checks
on:
  push:
    branches: [codex/google-business-controls]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo_mysql
          coverage: none
      - name: PHP syntax
        run: find desk1 -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Google validation checks
        run: php desk1/desk.mortonsmechanical.com/checks/google.php
      - name: Updater integrity and recovery checks
        run: php desk1/desk.mortonsmechanical.com/checks/updater.php
      - name: Browser script syntax
        run: |
          node --check desk1/desk.mortonsmechanical.com/assets/google.js
          node --check desk1/desk.mortonsmechanical.com/assets/update-upload.js
      - name: Package installer and compatible update
        run: python3 tools/package-updater.py
      - uses: actions/upload-artifact@v4
        with:
          name: Service-Desk-Updater-Files
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
